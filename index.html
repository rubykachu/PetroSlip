<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Phiếu Xăng Dầu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <div class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            Tùy chỉnh tiêu đề
        </div>

        <div class="form-group">
            <label>Tên Đơn Vị</label>
            <input type="text" id="unitName" placeholder="VD: CÔNG TY TNHH VẬN TẢI..." oninput="updatePreview()">
            <div class="range-row">
                <label class="range-label">Cỡ chữ: <span id="unitNameSizeVal">9.5</span>pt</label>
                <input type="range" id="unitNameSize" min="7" max="16" step="0.5" value="9.5" oninput="updatePreview()">
            </div>
        </div>

        <div class="form-group">
            <label>Địa chỉ & SĐT</label>
            <input type="text" id="address" placeholder="28 Huỳnh Thúc Kháng, Phường Hải Châu, TP Đà Nẵng" oninput="updatePreview()">
            <div class="range-row">
                <label class="range-label">Cỡ chữ: <span id="addressSizeVal">8</span>pt</label>
                <input type="range" id="addressSize" min="6" max="12" step="0.5" value="8" oninput="updatePreview()">
            </div>
        </div>

        <div class="form-group">
            <label>Mã Số Thuế - MST <span style="color:#94a3b8; font-weight:400;">(không bắt buộc)</span></label>
            <input type="text" id="taxId" placeholder="" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <div class="range-row">
                <label class="range-label">Giãn dòng tiêu đề: <span id="headerLineHeightVal">1.5</span></label>
                <input type="range" id="headerLineHeight" min="1.0" max="2.0" step="0.1" value="1.5" oninput="updatePreview()">
            </div>
        </div>

        <hr class="divider">

        <div class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 8.25h15m-16.5 7.5h15m-1.8-13.5-3.9 19.5m-2.1-19.5-3.9 19.5" />
            </svg>
            Quản Lý Số In
        </div>

        <div class="row">
            <div class="col">
                <label>Từ số (Min)</label>
                <input type="number" id="minNum" value="1" min="1" oninput="updatePreview()">
            </div>
            <div class="col">
                <label>Đến số (Max)</label>
                <input type="number" id="maxNum" value="1" min="1">
            </div>
        </div>
        <div class="helper-text">
            Định dạng: <strong><span id="formatPreview">2602/0001</span></strong>
            &nbsp;|&nbsp; Số phiếu: <strong><span id="totalCount">1</span></strong>
        </div>

        <hr class="divider">

        <div class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
            </svg>
            Tùy chỉnh nội dung
        </div>

        <!-- Sub: Phiếu & Liên -->
        <div class="sub-section-title">Phiếu & Liên</div>

        <div class="form-group">
            <label>Tiêu đề phiếu</label>
            <input type="text" id="voucherTitle" placeholder="PHIẾU CẤP XĂNG DẦU" oninput="updatePreview()">
        </div>

        <div class="row" style="margin-bottom: 12px;">
            <div class="col">
                <label>Liên 1</label>
                <input type="text" id="lien1Text" placeholder="(Liên 1: Lưu)" oninput="updatePreview()">
            </div>
            <div class="col">
                <label>Liên 2</label>
                <input type="text" id="lien2Text" placeholder="(Liên 2: Giao CH xăng dầu)" oninput="updatePreview()">
            </div>
        </div>

        <!-- Sub: Dòng 1 -->
        <div class="sub-section-title">Dòng 1</div>

        <div class="row" style="margin-bottom: 6px;">
            <div class="col">
                <label>Nhãn</label>
                <input type="text" id="locationLabel" placeholder="Địa điểm nhận" oninput="updatePreview()">
            </div>
            <div class="col">
                <label>Giá trị <span style="color:#94a3b8; font-weight:400;">(in sẵn)</span></label>
                <input type="text" id="receiveLocation" placeholder="Để trống = viết tay" oninput="updatePreview()">
            </div>
        </div>
        <div class="checkbox-row" style="margin-bottom: 12px;">
            <label class="checkbox-label"><input type="checkbox" id="locationBold" onchange="updatePreview()"> In đậm</label>
            <label class="checkbox-label"><input type="checkbox" id="locationItalic" onchange="updatePreview()"> In nghiêng</label>
        </div>

        <!-- Sub: Dòng 2 -->
        <div class="sub-section-title">Dòng 2</div>

        <div class="row" style="margin-bottom: 6px;">
            <div class="col">
                <label>Nhãn ô liên 1</label>
                <input type="text" id="field1Label" placeholder="Biển số xe" oninput="updatePreview()">
            </div>
            <div class="col">
                <label>Giá trị liên 1 <span style="color:#94a3b8; font-weight:400;">(in sẵn)</span></label>
                <input type="text" id="field1Value" placeholder="Để trống = viết tay" oninput="updatePreview()">
            </div>
        </div>

        <div class="row" style="margin-bottom: 12px;">
            <div class="col">
                <label>Nhãn ô liên 2</label>
                <input type="text" id="field2Label" placeholder="Tên lái xe" oninput="updatePreview()">
            </div>
            <div class="col">
                <label>Giá trị liên 2 <span style="color:#94a3b8; font-weight:400;">(in sẵn)</span></label>
                <input type="text" id="field2Value" placeholder="Để trống = viết tay" oninput="updatePreview()">
            </div>
        </div>

        <!-- Sub: Mục nhiên liệu -->
        <div class="sub-section-title">Mục nhiên liệu</div>

        <div class="form-group">
            <label>Tiêu đề mục</label>
            <input type="text" id="fuelSectionLabel" placeholder="Số lượng xăng/dầu được cấp:" oninput="updatePreview()">
        </div>

        <div class="row" style="margin-bottom: 6px;">
            <div class="col">
                <label>Nhãn số tiền</label>
                <input type="text" id="moneyLabel" placeholder="Số tiền" oninput="updatePreview()">
            </div>
            <div class="col">
                <label>Đơn vị</label>
                <input type="text" id="moneyUnit" placeholder="VNĐ" oninput="updatePreview()">
            </div>
        </div>

        <div class="form-group">
            <label>Giá trị số tiền <span style="color:#94a3b8; font-weight:400;">(in sẵn)</span></label>
            <input type="text" id="moneyValue" placeholder="Để trống = viết tay" oninput="updatePreview()">
        </div>

        <div class="row" style="margin-bottom: 12px;">
            <div class="col">
                <label>Nhãn dòng cuối</label>
                <input type="text" id="textAmountLabel" placeholder="Bằng chữ" oninput="updatePreview()">
            </div>
            <div class="col">
                <label>Giá trị <span style="color:#94a3b8; font-weight:400;">(in sẵn)</span></label>
                <input type="text" id="textAmountValue" placeholder="Để trống = viết tay" oninput="updatePreview()">
            </div>
        </div>

        <hr class="divider">

        <div class="form-group">
            <label>Khổ giấy</label>
            <select id="paperSize" onchange="changePaperSize()">
                <option value="A5">A5 (210 × 148 mm)</option>
                <option value="A6">A6 (148 × 105 mm)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Hướng giấy</label>
            <select id="paperOrientation" onchange="changePaperSize()">
                <option value="landscape">Ngang</option>
                <option value="portrait">Dọc</option>
            </select>
        </div>

        <div class="form-group">
            <div class="range-row">
                <label class="range-label">Giãn dòng nội dung: <span id="lineHeightVal">1.5</span></label>
                <input type="range" id="lineHeight" min="1.0" max="2.5" step="0.1" value="1.5" oninput="updatePreview()">
            </div>
        </div>

        <div class="form-group">
            <div class="range-row">
                <label class="range-label">Cỡ chữ nội dung: <span id="bodySizeVal">10</span>pt</label>
                <input type="range" id="bodySize" min="7" max="14" step="0.5" value="10" oninput="updatePreview()">
            </div>
        </div>

        <button class="btn btn-primary" onclick="handlePrint()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0 .229 2.523a1.125 1.125 0 0 1-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0 0 21 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 0 0-1.913-.247M6.34 18H5.25A2.25 2.25 0 0 1 3 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 0 1 1.913-.247m10.5 0a48.536 48.536 0 0 0-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5Zm-3 0h.008v.008H15V10.5Z" />
            </svg>
            IN PHIẾU NGAY
        </button>

        <button class="btn btn-secondary" onclick="resetConfig()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
            Xóa Cấu Hình
        </button>

        <div class="app-version">
            Phiên bản: <strong>1.4.0</strong> &nbsp;|&nbsp; Cập nhật: <strong>10/02/2026</strong>
        </div>
    </div>

    <div id="main-content">
        <div id="preview-wrapper"></div>
    </div>

    <div id="print-container"></div>

    <script src="main.js"></script>
</body>
</html>
